name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@master
        # setup-homebrew auto-taps this repo as wysaid/ccap from GitHub remote

      - name: Install from source
        run: HOMEBREW_NO_INSTALL_FROM_API=1 brew install --build-from-source --verbose wysaid/ccap/ccap

      - name: brew test
        run: brew test wysaid/ccap/ccap

      - name: brew audit --new
        run: brew audit --new --formula wysaid/ccap/ccap

      - name: Verify CLI
        run: |
          ccap --version
          ccap --help

      - name: Cleanup
        if: always()
        run: brew uninstall ccap || true

