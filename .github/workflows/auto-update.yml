name: Auto Update Formula

on:
  schedule:
    # Run daily at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch:
    # Allow manual triggering

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: auto-update-formula
  cancel-in-progress: false

jobs:
  check-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get current formula version
        id: current
        run: |
          # Extract the tag between /v and .tar.gz without consuming the archive suffix.
          mapfile -t CURRENT_VERSIONS < <(
            sed -nE 's#^[[:space:]]*url "https://github.com/wysaid/CameraCapture/archive/refs/tags/v([^"]+)\.tar\.gz"$#\1#p' ccap.rb
          )
          if [ "${#CURRENT_VERSIONS[@]}" -ne 1 ]; then
            echo "Error: Expected exactly one CameraCapture release URL in ccap.rb"
            exit 1
          fi
          CURRENT_VERSION="${CURRENT_VERSIONS[0]}"
          if ! [[ "$CURRENT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Error: Invalid formula version: $CURRENT_VERSION"
            exit 1
          fi
          echo "version=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"
          echo "Current version: v$CURRENT_VERSION"

      - name: Get latest release from upstream
        id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! LATEST_RELEASE=$(gh api repos/wysaid/CameraCapture/releases/latest --jq '.tag_name' 2>&1); then
            echo "Error: Failed to fetch latest release from upstream"
            exit 1
          fi
          if [ -z "$LATEST_RELEASE" ]; then
            echo "Error: No release tag found"
            exit 1
          fi
          LATEST_VERSION=${LATEST_RELEASE#v}
          
          # Get release notes
          RELEASE_NOTES=$(gh api repos/wysaid/CameraCapture/releases/latest --jq '.body // "No release notes provided."' | sed -n '1,80p')
          
          echo "version=$LATEST_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$LATEST_RELEASE" >> "$GITHUB_OUTPUT"
          
          # Save release notes to file for PR body
          printf '%s\n' "$RELEASE_NOTES" > /tmp/release_notes.txt
          
          echo "Latest upstream version: $LATEST_RELEASE"

      - name: Check if update is needed
        id: check
        run: |
          if [ "${{ steps.current.outputs.version }}" = "${{ steps.upstream.outputs.version }}" ]; then
            echo "No update needed. Current version (${{ steps.current.outputs.version }}) matches upstream."
            echo "needs_update=false" >> "$GITHUB_OUTPUT"
          else
            echo "Update needed: v${{ steps.current.outputs.version }} -> v${{ steps.upstream.outputs.version }}"
            echo "needs_update=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Download tarball and calculate SHA256
        if: steps.check.outputs.needs_update == 'true'
        id: sha256
        run: |
          TAG="${{ steps.upstream.outputs.tag }}"
          URL="https://github.com/wysaid/CameraCapture/archive/refs/tags/${TAG}.tar.gz"
          echo "Downloading: $URL"
          if ! curl -sSfL "$URL" -o source.tar.gz; then
            echo "Error: Failed to download tarball from $URL"
            exit 1
          fi
          SHA256=$(sha256sum source.tar.gz | awk '{print $1}')
          if ! echo "$SHA256" | grep -qE '^[a-f0-9]{64}$'; then
            echo "Error: Invalid SHA256 format: $SHA256"
            exit 1
          fi
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"
          echo "SHA256: $SHA256"
          rm source.tar.gz

      - name: Update formula
        if: steps.check.outputs.needs_update == 'true'
        run: |
          NEW_VERSION="${{ steps.upstream.outputs.version }}"
          NEW_SHA256="${{ steps.sha256.outputs.sha256 }}"
          
          # Update version in URL (supports extended versions like 1.2.0-beta)
          sed -i -E "s#(url \"https://github.com/wysaid/CameraCapture/archive/refs/tags/v)[^\"]+(\.tar\.gz\")#\1${NEW_VERSION}\2#" ccap.rb
          
          # Update SHA256 (match exactly 64 hex characters)
          sed -i "s|sha256 \"[a-f0-9]\{64\}\"|sha256 \"${NEW_SHA256}\"|" ccap.rb
          
          # Validate that the version and SHA256 were updated
          if ! grep -Fq "v${NEW_VERSION}.tar.gz" ccap.rb; then
            echo "Error: Failed to update version in ccap.rb"
            exit 1
          fi
          if ! grep -Fq "${NEW_SHA256}" ccap.rb; then
            echo "Error: Failed to update SHA256 in ccap.rb"
            exit 1
          fi
          
          echo "Formula updated to v${NEW_VERSION}"
          cat ccap.rb

      - name: Prepare pull request body
        if: steps.check.outputs.needs_update == 'true'
        env:
          PREVIOUS_VERSION: ${{ steps.current.outputs.version }}
          NEW_VERSION: ${{ steps.upstream.outputs.version }}
          NEW_SHA256: ${{ steps.sha256.outputs.sha256 }}
          RELEASE_TAG: ${{ steps.upstream.outputs.tag }}
        run: |
          # Markdown code spans below must remain literal.
          # shellcheck disable=SC2016
          {
            printf '%s\n' \
              '## Automated Formula Update' \
              '' \
              'This PR was automatically created by the auto-update workflow.' \
              '' \
              '### Changes'
            printf -- '- **Previous version:** `v%s`\n' "$PREVIOUS_VERSION"
            printf -- '- **New version:** `v%s`\n' "$NEW_VERSION"
            printf -- '- **SHA256:** `%s`\n' "$NEW_SHA256"
            printf '\n### Upstream Release\n'
            printf -- '- [Release %s](https://github.com/wysaid/CameraCapture/releases/tag/%s)\n' "$RELEASE_TAG" "$RELEASE_TAG"
            printf '\n### Release Highlights\n\n'
            if [ -s /tmp/release_notes.txt ]; then
              cat /tmp/release_notes.txt
            else
              printf '%s\n' 'See the upstream release page for details.'
            fi
            printf '%s\n' \
              '' \
              '### Testing Checklist' \
              '- [ ] Formula installs successfully' \
              '- [ ] Library can be linked and used' \
              '- [ ] CLI tool (`ccap`) works correctly' \
              '- [ ] Tests pass (`brew test ccap`)' \
              '' \
              '---' \
              '*Please review the changes and merge if everything looks correct.*'
          } > "$RUNNER_TEMP/pull-request-body.md"

      - name: Create Pull Request
        if: steps.check.outputs.needs_update == 'true'
        id: cpr
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ github.token }}
          commit-message: "Update ccap to v${{ steps.upstream.outputs.version }}"
          title: "Update ccap to v${{ steps.upstream.outputs.version }}"
          body-path: ${{ runner.temp }}/pull-request-body.md
          branch: release-v${{ steps.upstream.outputs.version }}
          base: main
          labels: |
            automated
            formula-update

      - name: Run CI for pull request branch
        if: steps.cpr.outputs.pull-request-operation == 'created' || steps.cpr.outputs.pull-request-operation == 'updated'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BRANCH: release-v${{ steps.upstream.outputs.version }}
        run: |
          gh workflow run test-formula.yml --ref "$PR_BRANCH"
          echo "Dispatched CI for $PR_BRANCH"
